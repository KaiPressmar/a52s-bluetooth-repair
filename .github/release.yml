changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Diagnostics and repair experiments
      labels:
        - diagnostics
        - repair
        - experiment
    - title: Testing and reliability
      labels:
        - tests
        - ci
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - '*'
