name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    name: ${{ matrix.label }} · ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: A52s
            path: a52s
            label: Galaxy A52s 5G
            runtime: Android 14 / One UI 6.1
          - flavor: S22
            path: s22
            label: Galaxy S22
            runtime: Android 16
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 14 through Android 16 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core domain + device runtime)
        run: ./gradlew :core:test :app:test${{ matrix.flavor }}DebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew :app:lint${{ matrix.flavor }}Debug --stacktrace

      - name: Build installable debug APK
        run: ./gradlew :app:assemble${{ matrix.flavor }}Debug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ matrix.path }}-${{ github.sha }}
          path: |
            core/build/reports/tests/test/
            app/build/reports/tests/test${{ matrix.flavor }}DebugUnitTest/
            app/build/screenshots/
            app/build/reports/lint-results-${{ matrix.path }}Debug.html
            app/build/reports/lint-results-${{ matrix.path }}Debug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload device-specific debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-repair-${{ matrix.path }}-debug-${{ github.sha }}
          path: app/build/outputs/apk/${{ matrix.path }}/debug/app-${{ matrix.path }}-debug.apk
          if-no-files-found: error
          retention-days: 14
