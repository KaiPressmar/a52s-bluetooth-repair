name: Release APK

# Releases are published only from release branches (release/X.Y), never from main.
# A push to release/X.Y whose RELEASE_VERSION has no tag yet publishes that version; any other
# push to a release branch is a no-op. Run manually on a release branch to retry a failed release.
# Process and branch model: RELEASING.md.

on:
  push:
    branches: [ 'release/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release branch
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      previous_tag: ${{ steps.check.outputs.previous_tag }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version, branch, changelog and tag
        id: check
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          TAG="v$VERSION"

          # Stable versions only: the in-app updater offers every non-draft release to all users.
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]] \
            || { echo "::error::RELEASE_VERSION '$VERSION' is not a stable MAJOR.MINOR.PATCH version"; exit 1; }
          LINE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          [ "$BRANCH" = "release/$LINE" ] \
            || { echo "::error::Version $VERSION belongs on release/$LINE, not $BRANCH"; exit 1; }

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          grep -Eq "^## $(printf '%s' "$VERSION" | sed 's/\./\\./g')( |$)" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }

          # Latest only if this is the highest stable version; a patch on an older line is not.
          STABLE_TAGS="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          HIGHEST="$(printf '%s\n%s\n' "$STABLE_TAGS" "$TAG" | sed '/^$/d' | sort -V | tail -n1)"
          LATEST=false
          [ "$HIGHEST" = "$TAG" ] && LATEST=true
          PREVIOUS="$(printf '%s\n%s\n' "$STABLE_TAGS" "$TAG" | sed '/^$/d' | sort -V | grep -B1 -x "$TAG" | head -n1)"
          [ "$PREVIOUS" = "$TAG" ] && PREVIOUS=""

          {
            echo "publish=true"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "previous_tag=$PREVIOUS"
            echo "latest=$LATEST"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing $TAG from $BRANCH (latest=$LATEST, previous=${PREVIOUS:-none})"

  release:
    name: Build, sign and publish
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages (compileSdk 37, build-tools 36)
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test release candidate
        run: |
          ./gradlew coverageReport --stacktrace
          python3 -m unittest discover -s scripts -p 'test_coverage_*.py'
          python3 scripts/coverage-summary.py build/reports/jacoco/coverageReport/coverageReport.xml --verify --markdown build/reports/jacoco/coverageReport/summary.md >> "$GITHUB_STEP_SUMMARY"
          ./gradlew :app:lintRelease --stacktrace

      - name: Upload release test reports and coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RELEASE_TAG }}-test-reports
          path: |
            build/reports/jacoco/coverageReport/
            core/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [ -n "$value" ] || { echo "Android release signing secrets are not configured."; exit 1; }
          done

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build signed universal release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify and package APKs
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          SRC="app/build/outputs/apk/release/app-release.apk"
          test -x "$APKSIGNER"
          test -f "$SRC"
          "$APKSIGNER" verify --verbose --print-certs "$SRC"

          # One universal APK. The former per-device names are byte-identical copies so that
          # installed 0.16.x builds of either variant find their update and converge.
          OUT="bluetooth-repair-${RELEASE_TAG}.apk"
          LEGACY_A52S="bluetooth-repair-a52s-5g-${RELEASE_TAG}.apk"
          LEGACY_S22="bluetooth-repair-galaxy-s22-${RELEASE_TAG}.apk"
          # Stable name for https://github.com/<repo>/releases/latest/download/bluetooth-repair.apk
          STABLE="bluetooth-repair.apk"
          for name in "$OUT" "$LEGACY_A52S" "$LEGACY_S22" "$STABLE"; do
            cp "$SRC" "$name"
            sha256sum "$name" > "$name.sha256"
          done

          {
            echo "APK=$OUT"
            echo "APK_LEGACY_A52S=$LEGACY_A52S"
            echo "APK_LEGACY_S22=$LEGACY_S22"
            echo "APK_STABLE=$STABLE"
          } >> "$GITHUB_ENV"

      - name: Attest APK provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.APK }}

      - name: Upload signed build
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RELEASE_TAG }}-signed-apk
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes from CHANGELOG.md
        env:
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # The '## X.Y.Z - title' section, without its heading, up to the next '## ' heading.
          awk -v v="$RELEASE_VERSION" '
            /^##? / { if (found) exit; if ($1 == "##" && $2 == v) { found = 1; next } }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > notes.md
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$RELEASE_TAG" >> notes.md
          fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="$(grep -E "^## $RELEASE_VERSION( |$)" CHANGELOG.md | head -n1 | sed -E 's/^## [^ ]+( - )?//')"
          gh release create "$RELEASE_TAG" \
            "$APK" "$APK.sha256" \
            "$APK_LEGACY_A52S" "$APK_LEGACY_A52S.sha256" \
            "$APK_LEGACY_S22" "$APK_LEGACY_S22.sha256" \
            "$APK_STABLE" "$APK_STABLE.sha256" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG${TITLE:+ – $TITLE}" \
            --notes-file notes.md \
            --latest="$LATEST"
