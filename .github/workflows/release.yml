name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v prefix, e.g. 0.5.0'
        required: true
        type: string
      prerelease:
        description: 'Publish as a GitHub prerelease (not shown as "Latest")'
        required: true
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths:
      - RELEASE_VERSION

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_VERSION:-}" ]; then
            RELEASE_VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Validate version and tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid semantic version: $RELEASE_VERSION"; exit 1; }
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then echo "Tag $RELEASE_TAG already exists"; exit 1; fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages (compileSdk 37, build-tools 36)
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test release candidate
        run: |
          ./gradlew :core:test :app:testDebugUnitTest --stacktrace
          ./gradlew :app:lintRelease --stacktrace

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [ -n "$value" ] || { echo "Android release signing secrets are not configured."; exit 1; }
          done

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build signed universal release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify and package APKs
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          SRC="app/build/outputs/apk/release/app-release.apk"
          test -x "$APKSIGNER"
          test -f "$SRC"
          "$APKSIGNER" verify --verbose --print-certs "$SRC"

          # One universal APK. The former per-device names are byte-identical copies so that
          # installed 0.16.x builds of either variant find their update and converge.
          OUT="bluetooth-repair-${RELEASE_TAG}.apk"
          LEGACY_A52S="bluetooth-repair-a52s-5g-${RELEASE_TAG}.apk"
          LEGACY_S22="bluetooth-repair-galaxy-s22-${RELEASE_TAG}.apk"
          # Stable name for https://github.com/<repo>/releases/latest/download/bluetooth-repair.apk
          STABLE="bluetooth-repair.apk"
          for name in "$OUT" "$LEGACY_A52S" "$LEGACY_S22" "$STABLE"; do
            cp "$SRC" "$name"
            sha256sum "$name" > "$name.sha256"
          done

          echo "APK=$OUT" >> "$GITHUB_ENV"
          echo "APK_LEGACY_A52S=$LEGACY_A52S" >> "$GITHUB_ENV"
          echo "APK_LEGACY_S22=$LEGACY_S22" >> "$GITHUB_ENV"
          echo "APK_STABLE=$STABLE" >> "$GITHUB_ENV"

      - name: Attest APK provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.APK }}

      - name: Upload signed build
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RELEASE_TAG }}-signed-apk
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$RELEASE_TAG"
            "$APK" "$APK.sha256"
            "$APK_LEGACY_A52S" "$APK_LEGACY_A52S.sha256"
            "$APK_LEGACY_S22" "$APK_LEGACY_S22.sha256"
            "$APK_STABLE" "$APK_STABLE.sha256"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TAG"
            --generate-notes
          )
          # Releases from RELEASE_VERSION on main are full releases; manual runs may opt into prerelease.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PRERELEASE_INPUT" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}"
