name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v prefix, e.g. 0.5.0'
        required: true
        type: string
      prerelease:
        description: 'Publish as a GitHub prerelease'
        required: true
        default: true
        type: boolean
  push:
    branches: [ main ]
    paths:
      - RELEASE_VERSION

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_VERSION:-}" ]; then
            RELEASE_VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Validate version and tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid semantic version: $RELEASE_VERSION"; exit 1; }
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then echo "Tag $RELEASE_TAG already exists"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 14 through Android 16 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test device-specific release candidates
        run: |
          ./gradlew :core:test :app:testA52sDebugUnitTest :app:testS22DebugUnitTest --stacktrace
          ./gradlew :app:lintA52sRelease :app:lintS22Release --stacktrace

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [ -n "$value" ] || { echo "Android release signing secrets are not configured."; exit 1; }
          done

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build signed A52s and S22 release APKs
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleA52sRelease :app:assembleS22Release --stacktrace

      - name: Verify and package device-specific APKs
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"

          SRC_A52S="app/build/outputs/apk/a52s/release/app-a52s-release.apk"
          SRC_S22="app/build/outputs/apk/s22/release/app-s22-release.apk"
          OUT_A52S="bluetooth-repair-a52s-5g-${RELEASE_TAG}.apk"
          OUT_S22="bluetooth-repair-galaxy-s22-${RELEASE_TAG}.apk"

          for src in "$SRC_A52S" "$SRC_S22"; do
            test -f "$src"
            "$APKSIGNER" verify --verbose --print-certs "$src"
          done

          cp "$SRC_A52S" "$OUT_A52S"
          cp "$SRC_S22" "$OUT_S22"
          sha256sum "$OUT_A52S" > "$OUT_A52S.sha256"
          sha256sum "$OUT_S22" > "$OUT_S22.sha256"

          echo "APK_A52S=$OUT_A52S" >> "$GITHUB_ENV"
          echo "APK_S22=$OUT_S22" >> "$GITHUB_ENV"

      - name: Attest APK provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.APK_A52S }}
            ${{ env.APK_S22 }}

      - name: Upload signed device builds
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-signed-device-apks
          path: |
            ${{ env.APK_A52S }}
            ${{ env.APK_A52S }}.sha256
            ${{ env.APK_S22 }}
            ${{ env.APK_S22 }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release with both device builds
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$RELEASE_TAG"
            "$APK_A52S" "$APK_A52S.sha256"
            "$APK_S22" "$APK_S22.sha256"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TAG"
            --generate-notes
          )
          if [ "$EVENT_NAME" = "push" ] || [ "$PRERELEASE_INPUT" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
